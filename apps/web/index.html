<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortly - Snip your links</title>
  <meta name="description" content="Snip long URLs down to size, pick your own alias, and keep count of every click.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ff4a1c'/%3E%3Cpath d='M7 22l18-12' stroke='%2316130f' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar wrap rise" style="--d:0ms">
    <a class="logo" href="/">shortly<span>.</span></a>
    <p class="tally"><b id="total-links">0</b> links <i>/</i> <b id="total-clicks">0</b> clicks</p>
  </header>

  <section class="hero wrap">
    <p class="kicker rise" style="--d:80ms">&#9986; the url shortener</p>
    <h1>
      <span class="line rise" style="--d:140ms">Make <span class="long">long</span></span>
      <span class="line rise" style="--d:240ms">links <span class="short">short</span>.</span>
    </h1>
    <p class="lede rise" style="--d:360ms">Paste a link, watch it get snipped, share the short one. Every click is counted.</p>
  </section>

  <div class="strips rise" style="--d:440ms" aria-hidden="true">
    <div class="strip a"><div class="track" id="track-a"></div></div>
    <div class="strip b"><div class="track" id="track-b"></div></div>
  </div>

  <main class="wrap main">
    <form id="form" class="box form rise" style="--d:520ms" autocomplete="off">
      <label class="lbl" for="url">Long link</label>
      <div class="row">
        <input id="url" type="url" placeholder="https://paste-your-very-long-link-here.com/..." required>
        <button id="submit" type="submit" class="go"><span>Snip it</span><b>&rarr;</b></button>
      </div>
      <label class="lbl" for="alias">Custom alias <em>optional</em></label>
      <div class="alias">
        <span class="prefix" id="prefix"></span>
        <input id="alias" type="text" placeholder="my-link" pattern="[A-Za-z0-9_\-]{3,32}" title="3-32 letters, digits, _ or -">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="snip" hidden aria-live="polite">
      <p class="snip-label" id="snip-label">Snipping...</p>
      <div class="snip-line" id="snip-line">
        <span id="snip-head"></span><span id="snip-tail"></span>
        <svg id="snip-scissors" class="scissors" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
          <path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/>
        </svg>
      </div>
      <div class="snip-final" id="snip-final" hidden>
        <a id="result-link" target="_blank" rel="noopener"></a>
        <button id="copy-result" class="mini" type="button">Copy</button>
      </div>
    </section>

    <section class="figures rise" style="--d:600ms" aria-label="Overview">
      <div><strong id="stat-links">0</strong><span>links snipped</span></div>
      <div><strong id="stat-clicks">0</strong><span>total clicks</span></div>
      <div><strong id="stat-saved">0</strong><span>characters saved</span></div>
    </section>

    <section class="ledger">
      <div class="ledger-head">
        <h2>The ledger</h2>
        <input id="search" type="search" placeholder="search..." aria-label="Search links">
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty"></p>
    </section>
  </main>

  <footer class="foot wrap">shortly &mdash; express + typescript &mdash; made to be small</footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
