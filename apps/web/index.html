<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortly - Shorten, share, track</title>
  <meta name="description" content="Turn long URLs into short, memorable links and see how many people click them.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M12 20l8-8M13.5 11.5l1-1a3.5 3.5 0 015 5l-1 1M18.5 20.5l-1 1a3.5 3.5 0 01-5-5l1-1' stroke='white' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="grid"></span></div>

  <header class="nav">
    <a class="brand" href="/" aria-label="Shortly home">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
        <rect width="32" height="32" rx="9" fill="url(#lg)"/>
        <path d="M12 20l8-8M13.5 11.5l1-1a3.5 3.5 0 015 5l-1 1M18.5 20.5l-1 1a3.5 3.5 0 01-5-5l1-1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <span>shortly</span>
    </a>
    <div class="live"><i></i> Live &middot; <b id="total-links">0</b> links &middot; <b id="total-clicks">0</b> clicks</div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="eyebrow">URL shortener</span>
      <h1>Long links, <span class="grad">made tiny.</span></h1>
      <p>Shorten any URL in a click, pick your own alias, and watch the clicks roll in.</p>

      <div class="demo" aria-hidden="true">
        <div class="demo-line long"><span class="tag">before</span><code id="demo-long"></code></div>
        <div class="demo-arrow">&darr;</div>
        <div class="demo-line short"><span class="tag">after</span><code id="demo-short"></code><em id="demo-saved"></em></div>
      </div>
    </section>

    <form id="form" class="panel form" autocomplete="off">
      <div class="row">
        <div class="input url">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
          <input id="url" type="url" placeholder="Paste your long URL here" aria-label="Destination URL" required>
        </div>
        <button id="submit" type="submit" class="primary">Shorten</button>
      </div>
      <div class="input alias">
        <span class="prefix" id="prefix"></span>
        <input id="alias" type="text" placeholder="custom-alias (optional)" aria-label="Custom alias" pattern="[A-Za-z0-9_\-]{3,32}" title="3-32 letters, digits, _ or -">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="result" hidden>
      <div class="result-top"><span class="check">&#10003;</span> Your link is ready</div>
      <div class="result-row">
        <a id="result-link" target="_blank" rel="noopener"></a>
        <button id="copy-result" class="btn" type="button">Copy link</button>
      </div>
    </section>

    <section class="stats" aria-label="Overview">
      <div class="stat"><span>Links created</span><strong id="stat-links">0</strong></div>
      <div class="stat"><span>Total clicks</span><strong id="stat-clicks">0</strong></div>
      <div class="stat"><span>Characters saved</span><strong id="stat-saved">0</strong></div>
    </section>

    <section class="links">
      <div class="links-head">
        <h2>Your links</h2>
        <div class="input search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search links" aria-label="Search links">
        </div>
      </div>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty"></p>
    </section>
  </main>

  <footer class="footer">Shortly &middot; built with Express &amp; TypeScript</footer>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
