<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shortly - URL shortener</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2334d399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="container">
    <nav class="nav">
      <span class="wordmark"><i></i>shortly</span>
      <span class="totals"><b id="total-links">0</b> links <span class="sep">/</span> <b id="total-clicks">0</b> clicks</span>
    </nav>

    <header class="hero">
      <h1>Short links,<br>no fuss.</h1>
      <p>Paste a URL. Get a link worth sharing.</p>
    </header>

    <form id="form" class="form" autocomplete="off">
      <div class="row">
        <input id="url" type="url" placeholder="Paste a long URL" aria-label="Destination URL" required>
        <button id="submit" type="submit">Shorten</button>
      </div>
      <div class="alias-input">
        <span class="prefix" id="prefix"></span>
        <input id="alias" type="text" placeholder="custom-alias (optional)" aria-label="Custom alias" pattern="[A-Za-z0-9_\-]{3,32}" title="3-32 letters, digits, _ or -">
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <section id="result" class="result" hidden>
      <a id="result-link" target="_blank" rel="noopener"></a>
      <button id="copy-result" class="ghost" type="button">Copy</button>
    </section>

    <section class="links">
      <h2>Recent links</h2>
      <ul id="list" class="list"></ul>
      <p id="empty" class="empty">Nothing here yet.</p>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
